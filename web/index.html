<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agent-core</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <button id="new-session" class="btn btn-primary">+ New session</button>
      <div id="session-actions">
        <button id="clear-session" class="btn btn-small">Clear history</button>
        <button id="delete-session" class="btn btn-small btn-danger">Delete</button>
        <button id="delete-all-sessions" class="btn btn-small btn-danger">Delete all</button>
      </div>
      <div id="turn-setting">
        <label for="max-turns-input" class="mono">turn budget</label>
        <input id="max-turns-input" type="number" min="1" value="8" title="Loop turns per session (applies to the next new/cleared session)" />
      </div>
      <div id="mode-setting">
        <label for="permission-mode" class="mono">permission mode</label>
        <select id="permission-mode" title="default = ask when a tool needs approval · plan = read-only tools only · auto = approve gated tools except run_code · strict = ask before every tool">
          <option value="default">default</option>
          <option value="plan">plan</option>
          <option value="auto">auto</option>
          <option value="strict">strict</option>
        </select>
      </div>
      <ul id="session-list"></ul>
      <div id="transport-toggle">
        <button id="transport-server" class="btn btn-small active">local</button>
        <button id="transport-browser" class="btn btn-small">in-browser</button>
      </div>
      <div id="model-status"><span class="dot dot-off"></span> checking model…</div>
    </aside>

    <main id="chat">
      <div id="messages"></div>

      <div id="approval-modal" class="modal" hidden>
        <div class="modal-card">
          <div class="modal-title">Pending approval</div>
          <div class="modal-tool" id="approval-tool">tool</div>
          <pre class="modal-args mono" id="approval-args"></pre>
          <div class="modal-actions">
            <button id="approve-btn" class="btn btn-approve">Approve</button>
            <button id="reject-btn" class="btn">Reject</button>
          </div>
          <div class="modal-hint mono">a = approve · r = reject · Esc = reject</div>
        </div>
      </div>

      <div id="composer">
        <span id="turn-counter" class="mono"></span>
        <input id="input" type="text" placeholder="Message…  (/stop to interrupt)" autocomplete="off" />
        <button id="send-btn" class="btn btn-primary">Send</button>
      </div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
