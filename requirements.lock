# requirements.lock -- fully pinned, transitive-inclusive dependency lock.
#
# WHY THIS EXISTS: requirements.txt declares direct dependencies as RANGES, so
# a future clean setup could resolve different (possibly API-breaking)
# versions. This file is the exact gate-passed environment -- a `pip freeze`
# of the verified .venv on 2026-10-20 (Python 3.13.5, Windows x64) -- and
# installing it reproduces that environment package-for-package, including
# every transitive dependency.
#
# WHO USES IT:
#   - bootstrap.ps1 step 3 installs from THIS file (pinned pip, no blind
#     `--upgrade pip`); it falls back to ranged requirements.txt with a
#     warning only if this file is missing.
#   - Future CI should install from it and assert that a fresh `pip freeze`
#     equals it exactly, so the lock cannot silently drift.
#
# REGENERATE (only after deliberately bumping requirements.txt AND running the
# full suites, per AGENTS.md -- never silently):
#   .venv\Scripts\python -m pip install -r requirements.txt
#   .venv\Scripts\python -m pip freeze > requirements.lock
#   .venv\Scripts\python -m pytest            # must be green
#   node test_webgpu_engine.mjs               # must be green
#
# NOTES:
#   - pip itself is pinned separately in bootstrap.ps1 ($pipPinned): it is the
#     installer, and pip freeze omits pip by default.
#   - Generated on Windows x64; colorama/pywin32 are Windows-only, so this
#     lock targets the Windows-first platform (CI runs windows-latest).
#   - requirements.txt ranges are the human-curated INTENT; every pinned
#     version below satisfies its range.

